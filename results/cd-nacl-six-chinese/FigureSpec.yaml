图件:
  标识: 六组双浓度梯度对比
  标题: 不同环糊精与 NaCl 浓度对目标离子峰强度及重复性的影响
  目标离子: m/z ≈ 590.2
  布局: 单坐标系，禁止多面板
  页面尺寸毫米: [220, 155]
数据:
  输入: 本轮最新六份文件，以 inputs.json 的文件名和 SHA256 为准
  峰窗口: [590.10, 590.32]
  寻峰: 各列唯一的窗口内部局部最大值，禁止合并峰或相加采集强度
  采集总数: 30
  每组采集数: 5
  标准差: 样本标准差，分母 n-1
  变异系数: 样本标准差/均值×100%
  预处理: 无
绘图:
  横轴: NaCl 浓度（μM）
  横轴刻度: [1, 5, 10]
  纵轴: 目标离子峰强度（×10⁶）
  颜色: 环糊精50μM青色、100μM蓝色、200μM紫色
  符号: 按环糊精浓度分别使用圆形、方形、菱形
  原始采集: 空心符号，小幅确定性横向错位，纵坐标不变
  均值: 实心符号与样本标准差误差棒，置于采集点前方
  分组偏移: 按环糊精浓度固定横向错开，防止遮挡
  连线: 仅连接同一环糊精浓度的实测均值，作为阅读引导，不代表预测
  缺失组合: 不绘制、不插值、不补零
  图例标题: 环糊精浓度
  图例: [50 μM, 100 μM, 200 μM]
  重点注释: 红色中文注释与箭头，下降幅度和CV由本次原始数据计算
  字体: 思源黑体简体中文
  背景: 白色
统计解释:
  显著性检验: 无
  机制: 仅能提示潜在盐相关抑制，不确认离子抑制机制
输出:
  图像: 仅一张600dpi中文PNG
  Origin工程: 当前Linux环境不支持生成真实OPJU，不提供伪文件
