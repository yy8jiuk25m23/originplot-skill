图件:
  标题: 不同环糊精与 NaCl 浓度组合对 m/z=590.2 目标离子峰强度的梯度影响
  布局: 单面板分类对比图
  画布尺寸毫米: [230, 155]
  输出: 单张600dpi中文PNG
数据:
  输入: 最新六份Excel，以inputs.json文件名和SHA256为准
  寻峰窗口: [590.10, 590.32]
  方法: 逐采集列提取唯一内部局部最大值，不合并相邻峰或采集列
  采集列数: 以文件实际列数为准
  统计: 均值、样本标准差（n-1）、变异系数CV=SD/均值×100%
  预处理: 无平滑、基线校正、归一化、剔除或填补
绘图:
  横轴: 试剂浓度组合
  分类顺序: [CD100_NaCl1, CD50_NaCl1, CD100_NaCl5, CD100_NaCl10, CD200_NaCl1, CD200_NaCl5]
  标签: 完整CD和NaCl浓度名称，分两行显示
  纵轴: 目标离子峰强度（×10⁶）
  原始点: 空心散点，仅横向轻微错位，避免覆盖均值与误差棒
  均值: 实心圆，样本标准差误差棒
  连线: 一条细灰线按六组指定分类顺序连接均值
  连线含义: 仅辅助比较，不代表连续浓度响应、插值或单变量因果关系
  上方标注: 各组均值及CV
  颜色: NaCl1蓝色系、NaCl5绿色系、NaCl10红色
  重点: 第四组红色中文注释，实际核算衰减幅度与CV
  字体: 思源黑体简体中文
  背景: 白色
  未测组合: 不绘制，不补零，不插值
解释:
  显著性: 不进行显著性检验，不标P值
  机制: 不凭峰强度变化确认离子抑制机理
Origin工程: 当前Linux环境无Windows Origin，不支持生成真实OPJU
